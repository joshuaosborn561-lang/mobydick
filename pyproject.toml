[project]
name = "mobydick"
version = "1.0.0"
description = "Moby Dick: SalesGlider prospect research and personalization MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
  "mcp>=2.0.0",
  "starlette>=0.40.0",
  "uvicorn>=0.30.0",
  "youtube-transcript-api>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
mobydick = "mobydick.cli:main"
mobydick-mcp = "mcp_server.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mobydick*", "mcp_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
